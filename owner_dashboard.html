<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>घरमालक डॅशबोर्ड | Satara Rental Hub</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration File -->
    <script src="firebase-config.js"></script>
    
    <!-- Multi-Language Support File -->
    <script src="lang.js"></script>
    
    <style>
        :root {
            --primary: #FF671F;
            --primary-dark: #E65C00;
            --bg-light: #F8FAFC;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --white: #FFFFFF;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --premium: #8B5CF6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Body changes for PC Centering */
        body { 
            background-color: var(--bg-light); 
            color: var(--text-dark); 
            padding-bottom: 90px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* App Wrapper for Desktop View */
        .app-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-light);
            min-height: 100vh;
            position: relative;
        }

        /* Desktop Navbar (Hidden on mobile) */
        .desktop-nav {
            display: none;
            background-color: var(--white);
            padding: 15px 20px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .desktop-nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-dark); }
        .desktop-nav-brand img { width: 35px; height: 35px; border-radius: 8px; }
        .desktop-nav-brand span { font-size: 18px; font-weight: 800; }
        .desktop-nav-links { display: flex; gap: 20px; align-items: center; }
        .desktop-nav-links a { text-decoration: none; color: var(--text-dark); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .desktop-nav-links .add-btn-desktop { background-color: var(--primary); color: var(--white); padding: 8px 15px; border-radius: 8px; font-weight: 700; transition: 0.2s; }
        .desktop-nav-links .add-btn-desktop:hover { background-color: var(--primary-dark); }

        /* टॉप हेडर (Profile & Greeting) */
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white); 
            padding: 55px 20px 35px 20px;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(255, 103, 31, 0.2);
            position: relative;
        }

        /* भाषा बदलणारे बटण (Top Right) */
        .lang-toggle-btn {
            position: absolute; top: 15px; right: 20px;
            background: rgba(255,255,255,0.2); color: var(--white); border: 1px solid var(--white);
            padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
            z-index: 10; 
        }

        .greeting { flex: 1; margin-top: 0; }
        .greeting h1 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .greeting p { font-size: 13px; opacity: 0.9; margin-bottom: 0; }
        .profile-pic {
            width: 50px; height: 50px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; border: 2px solid rgba(255,255,255,0.5); margin-top: 0;
            overflow: hidden;
        }
        .profile-pic img { width: 100%; height: 100%; object-fit: cover; }

        /* स्टॅट्स कार्ड्स */
        .stats-container { display: flex; gap: 15px; padding: 0 20px; margin-top: -20px; margin-bottom: 25px; position: relative; z-index: 5; }
        .stat-card {
            flex: 1; background: var(--white); border-radius: 16px; padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; border: 1px solid var(--border);
        }
        .stat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 10px auto; }
        .stat-card:nth-child(1) .stat-icon { background: #E0F2FE; color: #0284C7; } 
        .stat-card:nth-child(2) .stat-icon { background: #DCFCE7; color: #16A34A; } 
        
        .stat-value { font-size: 24px; font-weight: 800; color: var(--text-dark); margin-bottom: 2px; }
        .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

        /* विभाग हेडिंग */
        .section-header { padding: 0 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-title { font-size: 16px; font-weight: 800; color: var(--text-dark); }
        .btn-add { background: var(--primary); color: var(--white); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; }

        /* प्रॉपर्टी कार्ड (My Properties) */
        .property-list { padding: 0 20px; }
        .my-property-card {
            background: var(--white); border-radius: 16px; padding: 15px; margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border); position: relative;
        }
        
        .prop-status { position: absolute; top: 15px; right: 15px; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; }
        .status-live { background: #DCFCE7; color: #16A34A; }
        .status-pending { background: #FEF3C7; color: #D97706; }
        
        .premium-badge { position: absolute; top: -10px; left: 15px; background: var(--premium); color: white; padding: 3px 8px; font-size: 10px; font-weight: bold; border-radius: 4px; box-shadow: 0 2px 5px rgba(139, 92, 246, 0.4); }

        .prop-header { display: flex; gap: 15px; margin-bottom: 15px; margin-top: 5px;}
        .prop-img { width: 70px; height: 70px; border-radius: 10px; background: #E2E8F0; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #94A3B8; flex-shrink: 0; overflow: hidden; }
        .prop-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .prop-info { flex: 1; padding-right: 60px; }
        .prop-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; line-height: 1.3; }
        .prop-price { font-size: 16px; font-weight: 800; color: var(--primary); }
        .prop-location { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .prop-stats-bar { display: flex; justify-content: space-around; background: #F8FAFC; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #E2E8F0; }
        .mini-stat { text-align: center; }
        .mini-stat span { display: block; font-size: 14px; font-weight: 800; color: var(--text-dark); }
        .mini-stat small { font-size: 10px; color: var(--text-muted); }

        /* बटन्सची मांडणी */
        .btn-action { padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; text-align: center; border: 1px solid transparent; transition: 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;}
        .btn-action:active { transform: scale(0.97); }
        .btn-edit { background: var(--bg-light); color: var(--text-dark); border-color: var(--border); }

        /* नवीन सबस्क्रिप्शन प्लॅन्स स्टाईल (Dynamic Area) */
        .plans-section-header { padding: 25px 20px 15px 20px; font-size: 16px; font-weight: 800; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
        .plans-container { padding: 0 20px 25px 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .plan-card {
            background: var(--white); border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; position: relative;
            overflow: hidden;
        }
        .plan-card.basic { border-left: 5px solid var(--success); }
        .plan-card.premium { border-left: 5px solid var(--premium); background: #F5F3FF;}
        
        .plan-info { flex: 1; padding-right: 15px; }
        .plan-info h3 { font-size: 15px; font-weight: 800; color: var(--text-dark); margin-bottom: 5px; display:flex; align-items:center; gap:5px;}
        .plan-info p { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; line-height: 1.4; }
        .plan-price-box { text-align: right; }
        .plan-price { font-size: 18px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
        .plan-card.premium .plan-price { color: var(--premium); }
        
        .btn-buy {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: var(--white); border: none; padding: 8px 15px;
            border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); transition: 0.2s;
        }
        .btn-buy:active { transform: scale(0.95); }
        .btn-buy.free { background: var(--success); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

        .loading-text { text-align: center; font-size: 13px; color: var(--text-muted); width: 100%; padding: 20px; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: var(--white);
            display: flex; justify-content: space-around; padding: 10px 0;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.05); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 100;
        }
        .nav-item { text-align: center; color: #94A3B8; font-size: 11px; font-weight: 700; text-decoration: none; flex: 1; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; display: block; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }
        .nav-item.add-btn i {
            background: var(--primary); color: var(--white); width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: -20px auto 4px auto; box-shadow: 0 4px 10px rgba(255, 103, 31, 0.4); font-size: 20px;
        }

        /* -------------------------------------------------------------------------
           🆕 मीडिया क्वेरीज (Responsive Design for PC/Laptop) - GRIDS FIXED
        ------------------------------------------------------------------------- */
        @media (min-width: 768px) {
            body { background-color: #E2E8F0; padding-bottom: 30px; }
            .app-wrapper {
                margin-top: 20px; margin-bottom: 20px;
                border-radius: 20px; overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            }
            .desktop-nav { display: flex; }
            .dashboard-header { border-radius: 0; padding-top: 30px; }
            .bottom-nav { display: none; }
            .stats-container { gap: 20px; }
            
            /* 🆕 सक्तीने ग्रिड डिझाईन (Force Grid Mode on Desktop) */
            .property-list { 
                display: grid !important; 
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) !important; 
                gap: 20px !important; 
                padding: 20px !important; 
            }
            
            .my-property-card { 
                margin-bottom: 0 !important; 
                height: 100% !important; 
                display: flex !important; 
                flex-direction: column !important; 
                justify-content: space-between !important; 
            }
            
            /* 🆕 फोटो फिक्सिंग (Prevent Stretching) */
            .prop-img {
                width: 90px !important; 
                height: 90px !important; 
                overflow: hidden !important;
            }

            .prop-img img {
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important; 
                object-position: center !important; 
            }

            .plans-container { flex-direction: row; }
            .plan-card { flex: 1; }
        }
    </style>
</head>
<body>

<div class="app-wrapper"> 

    <!-- डेस्कटॉप नेव्हिगेशन (PC View) -->
    <div class="desktop-nav">
        <a href="index.html" class="desktop-nav-brand">
            <img src="Logo.png" alt="Logo" onerror="this.style.display='none'">
            <span>Satara Rental Hub</span>
        </a>
        <div class="desktop-nav-links">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="add_property.html" class="add-btn-desktop"><i class="fa-solid fa-plus"></i> Post Ad Free</a>
        </div>
    </div>

    <!-- टॉप हेडर -->
    <div class="dashboard-header">
        <button class="lang-toggle-btn" onclick="toggleLanguage()">ENG / मराठी</button>
        <div class="greeting">
            <h1><span data-lang="greeting">नमस्कार, </span><span id="owner-name-display">मालक!</span></h1>
            <p data-lang="greeting_desc">तुमच्या प्रॉपर्टीजचा परफॉर्मन्स पहा.</p>
        </div>
        <div class="profile-pic" id="owner-profile-pic">
            <i class="fa-regular fa-user"></i>
        </div>
    </div>

    <!-- ओव्हरऑल स्टॅट्स -->
    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-regular fa-eye"></i></div>
            <div class="stat-value" id="stat-views">0</div>
            <div class="stat-label" data-lang="total_views">एकूण व्ह्यूज</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-phone"></i></div>
            <div class="stat-value" id="stat-leads">0</div>
            <div class="stat-label" data-lang="total_leads">संपर्क केले (Leads)</div>
        </div>
    </div>

    <!-- माझ्या जाहिराती -->
    <div class="section-header">
        <div class="section-title"><span data-lang="my_ads">माझ्या जाहिराती</span> (<span id="my-ads-count">0</span>)</div>
        <a href="add_property.html" class="btn-add"><i class="fa-solid fa-plus"></i> <span data-lang="btn_new_ad">नवीन ॲड</span></a>
    </div>

    <div class="property-list" id="my-properties-container">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> डेटा लोड होत आहे...</div>
    </div>

    <!-- प्रीमियम प्लॅन्स (Dynamic from Admin) -->
    <div class="plans-section-header">
        <i class="fa-solid fa-crown" style="color: #F59E0B;"></i> <span data-lang="premium_plans">प्रीमियम प्लॅन्स (Upgrade)</span>
    </div>
    <div class="plans-container" id="dynamic-plans-container">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> प्लॅन्स लोड होत आहेत...</div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a href="owner_dashboard.html" class="nav-item active">
            <i class="fa-solid fa-chart-pie"></i>
            <span data-lang="nav_dashboard">डॅशबोर्ड</span>
        </a>
        <a href="add_property.html" class="nav-item add-btn">
            <i class="fa-solid fa-plus"></i>
            <span data-lang="nav_add">नवीन ॲड</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span data-lang="nav_profile">प्रोफाईल</span>
        </a>
    </div>

</div> 

    <!-- JavaScript (Firebase Reading) -->
    <script>
        let currentUserId = "unknown"; 

        window.onload = function() {
            if(typeof applySavedLanguage === 'function') { applySavedLanguage(); }
            
            // Security Redirect: If Not Logged In, Kick back to Index!
            if(!localStorage.getItem("currentUserId")) {
                window.location.replace("index.html");
                return;
            }

            if(localStorage.getItem("currentUserId")) {
                currentUserId = localStorage.getItem("currentUserId");
            } 
            
            loadUserData();
            loadMyProperties();
            loadSubscriptionPlans();
        };

        // १. युझरचे नाव आणि फोटो लोड करणे
        function loadUserData() {
            if(typeof db !== 'undefined') {
                db.collection("users").doc(currentUserId).get().then((doc) => {
                    if (doc.exists) {
                        let data = doc.data();
                        if(data.name) document.getElementById('owner-name-display').innerText = data.name + "!";
                        if(data.photoUrl) {
                            document.getElementById('owner-profile-pic').innerHTML = `<img src="${data.photoUrl}">`;
                        }
                    } else {
                        if(localStorage.getItem("currentUserName")) {
                            document.getElementById('owner-name-display').innerText = localStorage.getItem("currentUserName") + "!";
                        }
                    }
                }).catch(e => console.log(e));
            }
        }

        // २. मालकाच्या स्वतःच्या प्रॉपर्टीज लोड करणे
        function loadMyProperties() {
            const container = document.getElementById("my-properties-container");
            const countEl = document.getElementById("my-ads-count");
            
            let totalViews = 0;
            let totalLeads = 0;

            if(typeof db !== 'undefined') {
                db.collection("properties").where("ownerId", "==", currentUserId).get().then((querySnapshot) => {
                    container.innerHTML = "";
                    countEl.innerText = querySnapshot.size;

                    if(querySnapshot.empty) {
                        container.innerHTML = `<div class="loading-text">तुम्ही अजून कोणतीही प्रॉपर्टी ॲड केलेली नाही.</div>`;
                        return;
                    }

                    let properties = [];
                    let now = new Date();

                    querySnapshot.forEach((doc) => {
                        let p = doc.data(); 
                        p.id = doc.id; 

                        // प्रीमियम एक्सपायरी चेक
                        if (p.planType && p.planType !== 'basic' && p.expiryDate && p.expiryDate !== 'Lifetime') {
                            let expiryTime = new Date(p.expiryDate);
                            if (now > expiryTime) {
                                p.planType = 'basic';
                            }
                        }
                        properties.push(p);
                    });
                    properties.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

                    properties.forEach((prop) => {
                        totalViews += (prop.views || 0);
                        totalLeads += (prop.leads || 0);

                        let imgHtml = (prop.photoUrls && prop.photoUrls.length > 0) ? `<img src="${prop.photoUrls[0]}">` : `<i class="fa-regular fa-image"></i>`;
                        
                        // Status Logic (Live or Pending or Rented)
                        let statusHtml = '';
                        if(prop.status === "live") {
                            statusHtml = `<div class="prop-status status-live"><i class="fa-solid fa-circle-check"></i> <span data-lang="status_live">लाईव्ह</span></div>`;
                        } else if(prop.status === "rented" || prop.status === "inactive") {
                            statusHtml = `<div class="prop-status" style="background:#F1F5F9; color:#64748B;"><i class="fa-solid fa-eye-slash"></i> <span>Hidden (Rented)</span></div>`;
                        } else {
                            statusHtml = `<div class="prop-status status-pending"><i class="fa-solid fa-clock"></i> <span data-lang="status_pending">मंजुरी प्रलंबित</span></div>`;
                        }

                        // Premium Badge Check
                        let isPremium = prop.planType === 'premium1' || prop.planType === 'premium2';
                        let premiumBadgeHtml = isPremium ? `<div class="premium-badge"><i class="fa-solid fa-star"></i> Top Ad</div>` : ``;

                        let statsOpacity = prop.status === "live" ? "1" : "0.5";

                        let rentToggleBtn = prop.status === 'live' 
                            ? `<button class="btn-action" style="flex:1; background:#FFFBEB; color:#D97706; border:1px solid #FDE68A;" onclick="togglePropertyStatus('${prop.id}', 'live')"><i class="fa-solid fa-eye-slash"></i> भाड्याने दिली (Hide)</button>`
                            : `<button class="btn-action" style="flex:1; background:#DCFCE7; color:#16A34A; border:1px solid #BBF7D0;" onclick="togglePropertyStatus('${prop.id}', 'rented')"><i class="fa-solid fa-eye"></i> लाईव्ह करा</button>`;

                        let upgradeBtn = '';
                        if(prop.status === "live") {
                            upgradeBtn = isPremium 
                                ? `<div style="width:100%; text-align:center; padding:10px; border-radius:10px; background:#F0FDF4; color:#16A34A; border:1px solid #BBF7D0; font-size:13px; font-weight:700;"><i class="fa-solid fa-check-circle"></i> प्रीमियम ॲक्टिव्ह</div>` 
                                : `<button class="btn-action" style="width:100%; background: linear-gradient(135deg, #F59E0B, #D97706); color: white; border: none; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);" onclick="window.location.href='add_property.html'"><i class="fa-solid fa-rocket"></i> <span data-lang="btn_boost">अपग्रेड (Top Ad)</span></button>`;
                        } else if(prop.status === "pending") {
                            upgradeBtn = `<div style="width:100%; text-align:center; padding:8px; font-size:11px; color:#94A3B8;">ॲडमिनच्या मंजुरीची वाट पहा</div>`;
                        } else {
                            upgradeBtn = `<div style="width:100%; text-align:center; padding:8px; border-radius:10px; background:#F1F5F9; color:#64748B; font-size:11px; font-weight:700;">लाईव्ह झाल्यावर अपग्रेड करता येईल</div>`;
                        }

                        let propHtml = `
                        <div class="my-property-card">
                            ${premiumBadgeHtml}
                            ${statusHtml}
                            <div class="prop-header">
                                <div class="prop-img">${imgHtml}</div>
                                <div class="prop-info">
                                    <div class="prop-title">${prop.title}</div>
                                    <div class="prop-price">₹ ${prop.rent} <small>/ महिना</small></div>
                                    <div class="prop-location"><i class="fa-solid fa-location-dot"></i> ${prop.area}, ${prop.taluka}</div>
                                </div>
                            </div>
                            <div class="prop-stats-bar" style="opacity: ${statsOpacity};">
                                <div class="mini-stat"><span>${prop.views || 0}</span><small data-lang="stat_views">व्ह्यूज</small></div>
                                <div class="mini-stat"><span>${prop.leads || 0}</span><small data-lang="stat_leads">कॉल्स</small></div>
                                <div class="mini-stat"><span>${prop.saved || 0}</span><small data-lang="stat_saved">सेव्ह</small></div>
                            </div>
                            
                            <div style="display:flex; flex-direction:column; gap:10px; margin-top:auto;">
                                <div style="display:flex; gap:10px;">
                                    <button class="btn-action btn-edit" style="flex:1;" onclick="window.location.href='edit_property.html?id=${prop.id}'"><i class="fa-solid fa-pen"></i> <span data-lang="btn_edit">एडिट</span></button>
                                    ${rentToggleBtn}
                                </div>
                                ${upgradeBtn}
                            </div>

                        </div>`;
                        container.innerHTML += propHtml;
                    });
                    
                    document.getElementById('stat-views').innerText = totalViews;
                    document.getElementById('stat-leads').innerText = totalLeads;

                }).catch((error) => {
                    console.log("Error loading properties:", error);
                    container.innerHTML = `<div class="loading-text" style="color:red;">डेटा लोड करताना एरर आला.</div>`;
                });
            } else {
                container.innerHTML = `<div class="loading-text">Firebase कनेक्टेड नाही.</div>`;
            }
        }

        // प्रॉपर्टी लपवणे किंवा लाईव्ह करणे (Status Toggle Logic)
        function togglePropertyStatus(propId, currentStatus) {
            let newStatus = (currentStatus === 'live') ? 'rented' : 'live';
            let confirmMsg = (newStatus === 'rented') 
                ? "तुम्हाला खात्री आहे का? ही प्रॉपर्टी 'भाड्याने दिली' म्हणून मार्क होईल आणि ॲपवर दिसणे बंद होईल."
                : "ही प्रॉपर्टी पुन्हा ॲपवर सर्वांना 'लाईव्ह' दाखवायची आहे का?";
            
            if(confirm(confirmMsg)) {
                if(typeof db !== 'undefined') {
                    db.collection("properties").doc(propId).update({
                        status: newStatus,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        alert("✅ स्टेटस यशस्वीरित्या बदलले!");
                        loadMyProperties(); // Reload immediately to reflect UI change
                    }).catch(e => {
                        console.log(e);
                        alert("एरर आला! कृपया पुन्हा प्रयत्न करा.");
                    });
                }
            }
        }

        // ३. Firebase मधून ॲडमिनने सेट केलेले सबस्क्रिप्शन प्लॅन्स वाचणे
        function loadSubscriptionPlans() {
            const container = document.getElementById("dynamic-plans-container");

            if(typeof db !== 'undefined') {
                db.collection("admin_settings").doc("master_config").get().then((doc) => {
                    if (doc.exists && doc.data().plans) {
                        container.innerHTML = "";
                        let plansData = doc.data().plans;
                        
                        let plan1Fee = plansData.plan1_fee || 299;
                        let plan1Days = plansData.plan1_validity || 15;
                        let plan2Fee = plansData.plan2_fee || 399;
                        let plan2Days = plansData.plan2_validity || 30;

                        // Basic Free Plan
                        container.innerHTML += `
                        <div class="plan-card basic">
                            <div class="plan-info">
                                <h3 style="color:var(--success);"><i class="fa-solid fa-check-circle"></i> बेसिक लिस्टिंग</h3>
                                <p>प्रॉपर्टी फक्त सर्च लिस्टमध्ये दिसेल.</p>
                            </div>
                            <div class="plan-price-box">
                                <div class="plan-price" style="color:var(--success);">Free</div>
                                <button class="btn-buy free" onclick="window.location.href='add_property.html'">ॲड करा</button>
                            </div>
                        </div>`;

                        // Premium Plan 1
                        container.innerHTML += `
                        <div class="plan-card premium">
                            <div class="plan-info">
                                <h3><i class="fa-solid fa-star"></i> प्रीमियम ॲड (${plan1Days} दिवस)</h3>
                                <p>प्रॉपर्टी होमपेजच्या <b>टॉप बॅनरमध्ये</b> दिसेल.</p>
                            </div>
                            <div class="plan-price-box">
                                <div class="plan-price">₹ ${plan1Fee}</div>
                                <button class="btn-buy" onclick="window.location.href='add_property.html'">अपग्रेड करा</button>
                            </div>
                        </div>`;

                        // Premium Plan 2
                        container.innerHTML += `
                        <div class="plan-card premium">
                            <div class="plan-info">
                                <h3><i class="fa-solid fa-crown" style="color:#D97706;"></i> प्रीमियम ॲड (${plan2Days} दिवस)</h3>
                                <p>प्रॉपर्टी होमपेजच्या <b>टॉप बॅनरमध्ये</b> दिसेल.</p>
                            </div>
                            <div class="plan-price-box">
                                <div class="plan-price" style="color:#D97706;">₹ ${plan2Fee}</div>
                                <button class="btn-buy" style="background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);" onclick="window.location.href='add_property.html'">अपग्रेड करा</button>
                            </div>
                        </div>`;

                    } else {
                        container.innerHTML = `<div class="loading-text">प्लॅन्स उपलब्ध नाहीत.</div>`;
                    }
                }).catch(() => {
                    container.innerHTML = `<div class="loading-text" style="color:red;">प्लॅन्स लोड करताना एरर आला.</div>`;
                });
            }
        }

    </script>
</body>
</html>
